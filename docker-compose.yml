# Placewise: local stack. Start everything with:  docker compose up --build
# Services are added block by block. For the public demo link, add docker-compose.public.yml (see that file).

name: placewise

services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: placewise
      POSTGRES_DB: placewise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    # Not published to the host: the host's own Postgres uses 5432.
    # For debugging only, uncomment:  ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placewise -d placewise"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql://placewise:${POSTGRES_PASSWORD}@db:5432/placewise
      APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY in .env}
      DAILY_LLM_SPEND_CAP_USD: ${DAILY_LLM_SPEND_CAP_USD:-10}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Demo portal accounts (created on startup; passwords only in .env)
      PLACEWISE_DEMO_ADMIN_PASSWORD: ${PLACEWISE_DEMO_ADMIN_PASSWORD:-}
      PLACEWISE_DEMO_RECRUITER_PASSWORD: ${PLACEWISE_DEMO_RECRUITER_PASSWORD:-}
      # Owner's .env names → standard SDK names
      ANTHROPIC_API_KEY: ${PLACEWISE_ANTHROPIC_TEST_API_KEY:-}
      VOYAGE_API_KEY: ${PLACEWISE_VOYAGE_TEST_API_KEY:-}
      LANGSMITH_API_KEY: ${PLACEWISE_LANGSMITH_TEST_API_KEY:-}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-true}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-placewise}
    depends_on:
      db:
        condition: service_healthy
    # Development: reload on code changes. The venv lives in /opt/venv, so mounting src is safe.
    command: ["uvicorn", "placewise.main:app", "--host", "0.0.0.0", "--port", "8000", "--timeout-keep-alive", "75", "--reload", "--reload-dir", "/app/src"]
    volumes:
      - ./src:/app/src
      # Seed page (dev): aggregates + files only. data/seed/truth is deliberately NOT mounted.
      - ./data/seed/public:/app/data/seed/public:ro
      - ./data/seed/resumes:/app/data/seed/resumes:ro
      - ./outputs/samples:/app/outputs/samples:ro
      - storage:/app/storage
      - ./prompts:/app/prompts:ro
    ports:
      - "127.0.0.1:8000:8000"   # local only, for API docs at http://localhost:8000/docs
    restart: unless-stopped

  # Ingest worker: claims jobs from the Postgres queue. Scale with: docker compose up -d --scale worker=3
  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["python", "-m", "placewise.worker"]
    healthcheck:
      disable: true   # the image's HTTP healthcheck doesn't apply: workers serve no HTTP
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql://placewise:${POSTGRES_PASSWORD}@db:5432/placewise
      APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY in .env}
      DAILY_LLM_SPEND_CAP_USD: ${DAILY_LLM_SPEND_CAP_USD:-10}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      ANTHROPIC_API_KEY: ${PLACEWISE_ANTHROPIC_TEST_API_KEY:-}
      VOYAGE_API_KEY: ${PLACEWISE_VOYAGE_TEST_API_KEY:-}
      LANGSMITH_API_KEY: ${PLACEWISE_LANGSMITH_TEST_API_KEY:-}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-true}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-placewise}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - storage:/app/storage
      - ./prompts:/app/prompts:ro
      # Resume files only. The answer key (data/seed/truth) is deliberately NOT mounted.
      - ./data/seed/resumes:/app/data/seed/resumes:ro
    stop_grace_period: 60s
    restart: unless-stopped

  # On-demand tool, not a long-running service:  docker compose run --rm seed facts --count 500
  # The ONLY container (besides future evals) that mounts the answer key in data/seed/truth.
  seed:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    entrypoint: ["python", "-m", "placewise.seed"]
    command: ["--help"]
    environment:
      PLACEWISE_DATA_DIR: /app/data
      # Evals compare what the app stored against the answer key (this container is the only one with both)
      DATABASE_URL: postgresql://placewise:${POSTGRES_PASSWORD}@db:5432/placewise
      APP_SECRET_KEY: ${APP_SECRET_KEY:-unused-in-seed}
      DAILY_LLM_SPEND_CAP_USD: ${DAILY_LLM_SPEND_CAP_USD:-10}   # evals count against the same daily cap
      ANTHROPIC_API_KEY: ${PLACEWISE_ANTHROPIC_TEST_API_KEY:-}
      VOYAGE_API_KEY: ${PLACEWISE_VOYAGE_TEST_API_KEY:-}
      LANGSMITH_TRACING: ${SEED_TRACING:-false}   # off for data generation; evals turn it on (SEED_TRACING=true)
      LANGSMITH_API_KEY: ${PLACEWISE_LANGSMITH_TEST_API_KEY:-}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-placewise}
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./prompts:/app/prompts:ro
      - ./outputs:/app/outputs

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: dev
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"   # reliable file watching through Docker on macOS
    depends_on:
      - api
    volumes:
      - ./web:/app
      # Anonymous volumes keep the image's node_modules/.next from being hidden by the
      # bind mount. After changing dependencies:  docker compose up --build -V web
      - /app/node_modules
      - /app/.next
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  db_data:
  storage:
