[project]
name = "placewise"
version = "0.1.0"
description = "AI layer for A/E/C recruiting: resume intake, hybrid RAG matching, evidence-backed shortlists, LangGraph agents, n8n workflows."
authors = [
    { name = "Bhanu Prakash Putta", email = "bhanu.putta1999@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary,pool]>=3.2",
    "langsmith>=0.3",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-voyageai>=0.1",
    "langgraph>=0.3",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "pgvector>=0.3",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
seed = [
    "faker>=30",
    "reportlab>=4.2",
    "python-docx>=1.1",
    "pillow>=10",
]

[tool.uv]
default-groups = ["dev", "seed"]

[tool.uv.build-backend]
module-name = "placewise"
