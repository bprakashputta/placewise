# Automated AI code review on every pull request (Claude Code GitHub Action).
# Requires: the Claude GitHub App installed on this repo, and the ANTHROPIC_API_KEY repo secret.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request for Placewise, an AI layer for A/E/C recruiting
            (FastAPI + LangChain/LangGraph + Postgres/pgvector + Next.js, everything in Docker).
            Read AGENTS.md first: it defines the architecture, trust rules and working agreement.

            Review with a focus on:
            - Correctness: logic bugs, error handling, async/concurrency, SQL, idempotency.
            - Trust rules: LLM output validated with Pydantic; evidence verified by code; scores and
              years computed by code; resume text treated as untrusted data (prompt injection);
              nothing auto-sends; the answer key (data/seed/truth) never reaches the api/worker.
            - Security: secrets only in .env, parameterized SQL, path traversal, upload validation,
              auth on protected routes (from Block 3 on), no PII in logs.
            - Cost and reliability: retries bounded, spend cap respected, no repeated paid calls.
            - Tests: are new behaviors covered? Are tests free of network/LLM/database calls?
            - Simplicity: dead code, duplication, overbuilt abstractions.

            Be specific: file, line, failure scenario, suggested fix. Rank issues as Blocker,
            Should fix, or Nit. Skip praise-only comments. If the PR is solid, say so briefly.

            Note: The PR branch is already checked out in the current working directory.
            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to
            highlight specific code issues. Only post GitHub comments; don't submit review text as messages.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
